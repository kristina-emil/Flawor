spring.application.name=flavor
server.port=8080

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/flavor_db
spring.datasource.username=flavor_user
spring.datasource.password=Elephant_1920
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG

# Keycloak settings
keycloak.auth-server-url=http://192.168.1.100:8080  # Убрали /auth, т.к. в новых версиях он не нужен
keycloak.realm=flavor-realm
keycloak.resource=flavor-app
keycloak.bearer-only=true

# Настройки Spring Security для работы с Keycloak
spring.security.oauth2.resource-server.jwt.issuer-uri=http://localhost:8081/realms/flavor-realm  # Исправили порт 8080 → 8081

# Логирование для Keycloak
logging.level.org.keycloak=DEBUG
logging.level.org.springframework.web=DEBUG

# Включение Prometheus-эндпоинта
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Включение сервера метрик
management.prometheus.metrics.export.enabled=true

# Включение акта здоровья
management.endpoint.health.show-details=always
