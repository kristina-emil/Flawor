name: Java CI with Spring Boot and Docker

on:
  push:
    branches: [ main, server ]
  pull_request:
    branches: [ main, server ]

jobs:
  build-and-test:
    name: Build, Test, and Package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: flavor_db
          POSTGRES_USER: flavor_user
          POSTGRES_PASSWORD: Elephant_1920
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Install Prometheus
      run: |
          chmod +x ./install-prometheus.sh
          ./install-prometheus.sh

    - name: Start Keycloak (dev mode)
      run: |
        cd keycloak
        chmod +x ./bin/kc.sh
        nohup ./bin/kc.sh start-dev --http-port=8081 > keycloak.log 2>&1 &
        sleep 30  # ждем запуска

    - name: Start monitoring services
      run: |
        cd monitoring
        docker-compose down
        docker-compose up -d

    - name: Compile and run tests
      run: mvn clean verify

    - name: Package the application
      run: mvn package -DskipTests

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flavor-jar
        path: target/*.jar

  publish:
    name: Publish Artifact to GitHub Packages
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: flavor-jar

    - name: Deploy JAR to GitHub Packages
      run: mvn deploy -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
